<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcana 运营后台</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1c2330; --muted:#69727f; --ok:#1a7f37; --warn:#b97a00; --bad:#c93030; --accent:#2563eb; }
  *{ box-sizing:border-box }
  body{ margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text) }
  header{ display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line) }
  header h1{ font-size:16px; margin:0 }
  header .spacer{ flex:1 }
  header input{ width:280px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font:inherit }
  main{ max-width:1100px; margin:0 auto; padding:20px }
  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px }
  .card .k{ color:var(--muted); font-size:12px }
  .card .v{ font-size:20px; font-weight:600; margin-top:4px }
  section{ background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:20px; overflow:hidden }
  section h2{ font-size:14px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px }
  section h2 .spacer{ flex:1 }
  table{ width:100%; border-collapse:collapse }
  th,td{ text-align:left; padding:9px 16px; border-bottom:1px solid var(--line); font-size:13px }
  th{ color:var(--muted); font-weight:500; font-size:12px }
  tr:last-child td{ border-bottom:none }
  .pill{ display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; background:#eef1f5; color:var(--muted) }
  .pill.running{ background:#e3f4e8; color:var(--ok) }
  .pill.restarting,.pill.starting,.pill.timeout{ background:#fdf1dc; color:var(--warn) }
  .pill.crashed,.pill.error{ background:#fde7e7; color:var(--bad) }
  button{ font:inherit; font-size:12px; padding:4px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; color:var(--text) }
  button:hover{ border-color:var(--accent); color:var(--accent) }
  button:disabled{ opacity:.45; cursor:default }
  .muted{ color:var(--muted) }
  .error-text{ color:var(--bad); font-size:12px; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  pre#logBox{ margin:0; padding:14px 16px; background:#0f1419; color:#d7dde5; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; min-height:140px; max-height:420px; overflow:auto; white-space:pre-wrap; word-break:break-all }
  #connState{ font-size:12px }
  #connState.ok{ color:var(--ok) } #connState.bad{ color:var(--bad) }
  select{ font:inherit; font-size:12px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:#fff }
</style>
</head>
<body>
<header>
  <h1>Arcana 运营后台</h1>
  <span id="connState" class="muted">未连接</span>
  <div class="spacer"></div>
  <input id="tokenInput" type="password" placeholder="Admin Token（~/.arcana/admin_token）" autocomplete="off">
  <button id="connectBtn">连接</button>
</header>
<main>
  <div class="cards" id="overviewCards"></div>

  <section>
    <h2>服务
      <span class="spacer"></span>
      <button id="reloadBtn" title="重新扫描 services 目录">重新扫描</button>
    </h2>
    <table>
      <thead><tr>
        <th>服务</th><th>模式</th><th>状态</th><th>PID</th><th>重启</th><th>心跳</th><th>错误</th><th>操作</th>
      </tr></thead>
      <tbody id="servicesBody"><tr><td colspan="8" class="muted">等待连接…</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>日志：<span id="logTitle" class="muted">未选择服务</span>
      <span class="spacer"></span>
      <select id="logFileSel">
        <option value="manager">manager.log</option>
        <option value="service">service.log</option>
        <option value="sdk">sdk.log</option>
      </select>
      <button id="logRefreshBtn">刷新</button>
    </h2>
    <pre id="logBox">（点击服务行的「日志」按钮查看）</pre>
  </section>

  <section>
    <h2>Agents</h2>
    <table>
      <thead><tr><th>Agent</th><th>会话数</th><th>最近活动</th></tr></thead>
      <tbody id="agentsBody"><tr><td colspan="3" class="muted">等待连接…</td></tr></tbody>
    </table>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
